tion\":\"Где печатаются книги?\",\"answer\":\"Все изделия производятся компанией «Фотодом», в Минске. Это одна из лучших типографий, которая специализируется на профессиональной печати фотографий с 2006 года.\"}]},\"savedVersions\":\"история сохранений\"},\"restrictedDownloadGuide\":{\"title\":\"Чтобы скачать фото,\u003cbr/\u003e откройте ссылку в браузере.\",\"button\":\"Скопировать ссылку\"},\"visitCardModal\":{\"copy_contact\":\"Cохранить контакты\",\"scan_qrcode\":\"Отсканируйте QR-код, \u003cbr/\u003e чтобы сохранить контакты\"},\"notFound\":{\"title\":\"Ссылка некорректна либо срок хранения галереи истек.\",\"description\":\"Проверьте правильность ссылки или обратитесь к фотографу.\"},\"bannerDiscount\":{\"blackFriday\":\"Только в Черную пятницу — cкидка {{discount}}% на всё\",\"regularDiscount\":\"Скидка \u003cb\u003e\u0026nbsp;{{percent}}%\u003c/b\u003e на повторный заказ\",\"springSale\":\"Скидка \u003cb\u003e\u0026nbsp;{{percent}}%\u003c/b\u003e на всю печать\"},\"tracking\":{\"title\":\"Информация\u003cbr/\u003e о вашем заказе\",\"sections\":{\"yourOrder\":\"Ваш заказ\",\"orderInfo\":\"Информация о заказе\"},\"status\":{\"inProgress\":\"В обработке\",\"printing\":\"Печатается\",\"delivering\":\"Передан в службу доставки\",\"canceled\":\"Отменен\",\"error\":\"Ошибка\"},\"labels\":{\"quantity\":\"Количество:\",\"orderStatus\":\"Статус заказа:\",\"printDeadline\":\"Срок печати:\",\"deliveryService\":\"Служба доставки:\",\"orderDateTime\":\"Дата и время заказа:\",\"orderNumber\":\"Номер заказа:\",\"deliveryType\":\"Тип доставки:\",\"galleryLink\":\"Ссылка на галерею:\"},\"values\":{\"pieces\":\" шт.\",\"printDeadlineValue\":\"до 12 рабочих дней\",\"courier\":\"Курьер\",\"pickupPoint\":\"ПВЗ\"},\"description\":{\"inProgress\":\"В течение 3х рабочих дней, ваш заказ будет обработан и отправлен в печать. Также вся информация о заказе будет отправлена на ваш e-mail.\",\"inProgressComposeLayout\":\"В течение 3-х рабочих дней наш менеджер свяжется с вами в указанном мессенджере для сборки макета.\"},\"button\":{\"trackOrder\":\"Отследить заказ\"}},\"faceFilter\":{\"processing\":\"Идет поиск фото по лицам...\",\"result\":\"Результаты поиска\",\"found\":\"Найдено {{count}} фото\",\"change\":\"Изменить\",\"clear\":\"Очистить\",\"showMore\":\"+{{count}}\",\"apply\":\"Найти фото\",\"cancel\":\"Отменить\",\"selectFaces\":\"Выберите людей\",\"noResults\":\"Нет фото для выбранных людей\",\"photos\":\"фото\",\"selected\":\"{{count}} выбрано\"},\"offer\":{\"metadata\":{\"title\":\"Условия оказания услуги «Макет за вас»\",\"description\":\"Условия предоставления доступа к ПО по тарифу «Макет за вас» — публичная оферта ООО «ВИГБО»\"},\"title\":\"Условия предоставления доступа к ПО\u003cbr /\u003e по тарифу «Макет за вас»\",\"edition\":\"Редакция от 24 апреля 2026 года\",\"intro\":[\"Настоящие Условия являются публичной офертой Общества с ограниченной ответственностью «ВИГБО» (ОГРН 1226700005113, ИНН 6732226737, адрес: 214009, г. Смоленск, Южный мкр., д. 25Б, кв. 82; далее — Исполнитель), адресованной неограниченному кругу лиц.\",\"Совершение Заказчиком действия, указанного в разделе 2 настоящих Условий, означает полное и безоговорочное принятие условий оферты (акцепт) и заключение договора на условиях, изложенных ниже.\"],\"sections\":[{\"title\":\"1. Термины и определения\",\"blocks\":[{\"type\":\"p\",\"html\":\"\u003cstrong\u003eЗаказчик\u003c/strong\u003e — физическое лицо, оформившее заказ на предоставление доступа к Тарифу «Макет за вас» в порядке, предусмотренном настоящими Условиями.\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eПО\u003c/strong\u003e — программное обеспечение «Vigbo» (регистрационный номер в Едином реестре российских программ для ЭВМ и баз данных: 25441), исключительные права на которое принадлежат Исполнителю.\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eСервис\u003c/strong\u003e — функционирующая на основании ПО автоматизированная система и связанные с ней интернет-ресурсы Исполнителя.\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003e«Создание макета печатного фотоматериала»\u003c/strong\u003e — часть ПО, предоставляющая Заказчику программные инструменты для создания макета печатного фотоматериала и оформления заказа на его производство.\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eРедактор\u003c/strong\u003e — инструмент Сервиса, входящий в состав части ПО «Создание макета печатного фотоматериала», предназначенный для создания и редактирования Макета.\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eМакет\u003c/strong\u003e — цифровой файл, создаваемый в Редакторе, готовый к передаче на производство печатной фотопродукции.\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eТариф «Макет за вас»\u003c/strong\u003e (далее также — Тариф) — расширенный тариф доступа к части ПО «Создание макета печатного фотоматериала», в рамках которого Заказчику предоставляется доступ к функциональности Редактора, реализуемой при участии Специалиста Исполнителя, обеспечивающего создание Макета на основании фотографий и пожеланий Заказчика. Создание макета осуществляется исключительно с использованием ПО.\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eСпециалист\u003c/strong\u003e — сотрудник Исполнителя, обеспечивающий функционирование расширенного доступа к ПО в рамках Тарифа «Макет за вас».\"}]},{\"title\":\"2. Предмет оферты и акцепт\",\"blocks\":[{\"type\":\"p\",\"html\":\"2.1. Исполнитель предоставляет Заказчику доступ к части ПО «Создание макета печатного фотоматериала» по Тарифу «Макет за вас», а Заказчик оплачивает стоимость Тарифа в соответствии с настоящими Условиями.\"},{\"type\":\"p\",\"html\":\"2.2. Акцепт настоящей оферты осуществляется Заказчиком путем оплаты стоимости Тарифа в соответствии с разделом 4 настоящих Условий.\"},{\"type\":\"p\",\"html\":\"2.3. Акцепт возможен без предварительной регистрации Заказчика в Сервисе.\"},{\"type\":\"p\",\"html\":\"2.4. С момента акцепта договор между Исполнителем и Заказчиком считается заключенным на условиях, изложенных в настоящих Условиях.\"},{\"type\":\"p\",\"html\":\"2.5. Настоящие Условия регулируют исключительно отношения по предоставлению Заказчику доступа к ПО по Тарифу «Макет за вас» и не регулируют приобретение печатной фотопродукции.\"}]},{\"title\":\"3. Порядок предоставления доступа по Тарифу\",\"blocks\":[{\"type\":\"p\",\"html\":\"3.1. При оформлении заказа Заказчик указывает мессенджер, удобный для связи, и иные сведения, необходимые для предоставления доступа по Тарифу.\"},{\"type\":\"p\",\"html\":\"3.2. В течение 3 (трёх) рабочих дней с момента оплаты Тарифа Специалист связывается с Заказчиком в указанном мессенджере для согласования параметров Макета (выбор фотографий, структура, пожелания по оформлению).\"},{\"type\":\"p\",\"html\":\"3.3. Специалист обеспечивает создание Макета в Редакторе в течение 3 (трёх) рабочих дней с момента последнего согласования параметров с Заказчиком.\"},{\"type\":\"p\",\"html\":\"3.4. Специалист направляет Заказчику ссылку на Макет для предпросмотра в Редакторе.\"},{\"type\":\"p\",\"html\":\"3.5. Заказчик вправе передавать через Специалиста правки Макета. В рамках оплаченного Тарифа Исполнитель обеспечивает не более 10 (десяти) итераций правок. Одной итерацией считается совокупность замечаний Заказчика, переданных в одном сообщении.\"},{\"type\":\"p\",\"html\":\"3.6. После исчерпания итераций правок, предусмотренных п. 3.5, Заказчик вправе самостоятельно вносить изменения в Макет через Редактор до момента передачи Макета на печать.\"},{\"type\":\"p\",\"html\":\"3.7. Согласование Макета Заказчиком подтверждается сообщением Заказчика в мессенджере, соответствующим по смыслу понятию «Согласовано» или аналогичному.\"},{\"type\":\"p\",\"html\":\"3.8. Доступ по Тарифу «Макет за вас» считается предоставленным Исполнителем надлежащим образом с момента наступления одного из следующих событий, в зависимости от того, какое наступит раньше:\"},{\"type\":\"ul\",\"items\":[\"согласование Заказчиком Макета в порядке, предусмотренном п. 3.7;\",\"исчерпание 10 (десяти) итераций правок, предусмотренных п. 3.5.\"]},{\"type\":\"p\",\"html\":\"3.9. Если Заказчик не отвечает на сообщения Специалиста в течение 14 (четырнадцати) календарных дней с момента первого обращения Специалиста, доступ по Тарифу считается не предоставленным по не зависящим от Исполнителя причинам, а оплаченная стоимость Тарифа подлежит возврату Заказчику в полном объёме в порядке, предусмотренном разделом 5.\"},{\"type\":\"p\",\"html\":\"3.10. Согласованный Макет хранится в Сервисе в течение 3 (трёх) месяцев с момента согласования либо с момента последнего взаимодействия Заказчика со Специалистом. По истечении указанного срока Макет может быть удалён Исполнителем без дополнительного уведомления Заказчика.\"},{\"type\":\"p\",\"html\":\"3.11. Результатом предоставления доступа по Тарифу является возможность Заказчика просмотреть, согласовать и при необходимости самостоятельно редактировать созданный Специалистом Макет в Редакторе.\"}]},{\"title\":\"4. Стоимость Тарифа и порядок оплаты\",\"blocks\":[{\"type\":\"p\",\"html\":\"4.1. Стоимость Тарифа «Макет за вас» отображается в Сервисе на момент оформления заказа.\"},{\"type\":\"p\",\"html\":\"4.2. Оплата Тарифа производится банковской картой через электронную систему приема платежей, размещенную в Сервисе.\"},{\"type\":\"p\",\"html\":\"4.3. Моментом исполнения обязательства Заказчика по оплате является момент получения Исполнителем подтверждения операции от платёжного сервиса.\"},{\"type\":\"p\",\"html\":\"4.4. Стоимость Тарифа в полном объёме поступает Исполнителю.\"}]},{\"title\":\"5. Возврат денежных средств\",\"blocks\":[{\"type\":\"p\",\"html\":\"5.1. Стоимость Тарифа возвращается Заказчику в полном объёме в случае, предусмотренном п. 3.9 настоящих Условий (отсутствие ответа Заказчика в течение 14 календарных дней).\"},{\"type\":\"p\",\"html\":\"5.2. Заказчик вправе в любой момент отказаться от исполнения договора с возмещением Исполнителю фактически понесённых расходов в соответствии со ст. 32 Закона Российской Федерации «О защите прав потребителей». Размер фактически понесённых Исполнителем расходов определяется пропорционально объёму предоставленного доступа на момент отказа.\"},{\"type\":\"p\",\"html\":\"5.3. После предоставления доступа в соответствии с п. 3.8 возврат стоимости Тарифа не производится, поскольку обязательства Исполнителя считаются исполненными надлежащим образом.\"},{\"type\":\"p\",\"html\":\"5.4. Возврат денежных средств осуществляется тем же способом, которым была произведена оплата, в течение 10 (десяти) рабочих дней с момента принятия Исполнителем решения о возврате.\"}]},{\"title\":\"6. Ответственность сторон\",\"blocks\":[{\"type\":\"p\",\"html\":\"6.1. Исполнитель несёт ответственность за надлежащее предоставление доступа к ПО по Тарифу «Макет за вас» в соответствии с настоящими Условиями.\"},{\"type\":\"p\",\"html\":\"6.2. Исполнитель не несёт ответственности за:\"},{\"type\":\"ul\",\"items\":[\"качество производства и доставки печатной фотопродукции, изготавливаемой третьими лицами на основании Макета;\",\"соответствие цветопередачи готовой печатной продукции экранному отображению Макета, обусловленное техническими особенностями полиграфической печати;\",\"временную недоступность Сервиса или Редактора в связи с проведением технических работ.\"]},{\"type\":\"p\",\"html\":\"6.3. Заказчик гарантирует, что располагает всеми необходимыми правами на использование фотографий, передаваемых Исполнителю для создания Макета, в том числе правами на изображения лиц, содержащихся в фотографиях, а также согласием изображённых лиц на обработку их изображений в порядке, предусмотренном ст. 152.1 ГК РФ и законодательством о персональных данных. Заказчик обязуется освободить Исполнителя от любой ответственности перед третьими лицами в связи с нарушением авторских, смежных или иных прав, связанных с содержанием переданных фотографий.\"},{\"type\":\"p\",\"html\":\"6.4. В случае нарушения Заказчиком условий п. 6.3 Исполнитель вправе прекратить предоставление доступа к ПО без возврата оплаченной стоимости Тарифа и предъявить Заказчику регрессное требование в размере понесённых убытков.\"}]},{\"title\":\"7. Персональные данные\",\"blocks\":[{\"type\":\"p\",\"html\":\"7.1. Обработка персональных данных Заказчика осуществляется Исполнителем в соответствии с Политикой обработки персональных данных, размещённой по адресу: \u003ca href='https://vigbo.com/confidential-policy' target='_blank' rel='noopener noreferrer'\u003ehttps://vigbo.com/confidential-policy\u003c/a\u003e.\"},{\"type\":\"p\",\"html\":\"7.2. Оформляя заказ по Тарифу «Макет за вас», Заказчик подтверждает ознакомление с указанной Политикой и выражает согласие на обработку своих персональных данных в объёме и для целей, указанных в Политике.\"}]},{\"title\":\"8. Заключительные положения\",\"blocks\":[{\"type\":\"p\",\"html\":\"8.1. К отношениям между Исполнителем и Заказчиком применяется законодательство Российской Федерации.\"},{\"type\":\"p\",\"html\":\"8.2. Все споры и разногласия, возникающие между сторонами в связи с настоящими Условиями, подлежат разрешению в порядке, установленном законодательством Российской Федерации. До предъявления иска сторона, считающая свои права нарушенными, обязана направить другой стороне письменную претензию. Сторона, получившая претензию, обязана направить мотивированный ответ в течение 10 (десяти) рабочих дней с момента её получения.\"},{\"type\":\"p\",\"html\":\"8.3. Коммуникация между Исполнителем и Заказчиком в мессенджерах в рамках предоставления доступа по Тарифу не приравнивается к обмену юридически значимыми сообщениями, за исключением подтверждений, предусмотренных п. 3.7 настоящих Условий.\"},{\"type\":\"p\",\"html\":\"8.4. Настоящие Условия вступают в силу с момента их размещения в Сервисе и действуют до их замены новой редакцией. Исполнитель вправе в одностороннем порядке вносить изменения в настоящие Условия; новая редакция вступает в силу с момента её размещения в Сервисе.\"},{\"type\":\"p\",\"html\":\"8.5. Актуальная редакция настоящих Условий размещена по адресу: \u003ca href='https://gallery.photo/offer' target='_blank' rel='noopener noreferrer'\u003ehttps://gallery.photo/offer\u003c/a\u003e\"},{\"type\":\"p\",\"html\":\"8.6. Признание судом недействительным какого-либо положения настоящих Условий не влечёт недействительности остальных положений.\"}]},{\"title\":\"9. Реквизиты Исполнителя\",\"blocks\":[{\"type\":\"p\",\"html\":\"\u003cstrong\u003eПолное наименование:\u003c/strong\u003e Общество с ограниченной ответственностью «ВИГБО»\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eИНН:\u003c/strong\u003e 6732226737\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eОГРН:\u003c/strong\u003e 1226700005113\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eЮридический адрес:\u003c/strong\u003e 214009, г. Смоленск, Южный мкр., д. 25Б, кв. 82\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eАдрес электронной почты:\u003c/strong\u003e \u003ca href='mailto:hello@vigbo.com'\u003ehello@vigbo.com\u003c/a\u003e\"},{\"type\":\"p\",\"html\":\"\u003cstrong\u003eСайт:\u003c/strong\u003e \u003ca href='https://vigbo.com' target='_blank' rel='noopener noreferrer'\u003ehttps://vigbo.com\u003c/a\u003e\"}]}]}},\"locale\":\"ru\",\"isDomainValid\":true}]\n"])</script><script>self.__next_f.push([1,"24:I[352089,[\"/_next/static/chunks/0r90.doit1sm0.js\",\"/_next/static/chunks/0hcy0gmyojy.v.js\",\"/_next/static/chunks/0n-n3.0z234mf.js\",\"/_next/static/chunks/01taxl3-y3xgl.js\"],\"IconMark\"]\n1d:null\n"])</script><title>SubHI</title><meta name="description" content="Фото хранятся до 08 августа 2026, фотограф Диана Алимова"/><link rel="manifest" href="/site.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="msapplication-TileColor" content="#ffffff"/><meta name="format-detection" content="telephone=no"/><meta property="og:title" content="SubHI"/><meta property="og:description" content="Фото хранятся до 08 августа 2026, фотограф Диана Алимова"/><meta property="og:url" content="https
